<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="8" fill="#6366f1"/>
  <!-- Bar chart bars -->
  <rect x="6" y="18" width="4" height="8" rx="1.5" fill="white" opacity="0.5"/>
  <rect x="12" y="13" width="4" height="13" rx="1.5" fill="white" opacity="0.75"/>
  <rect x="18" y="8" width="4" height="18" rx="1.5" fill="white"/>
  <!-- Trend line -->
  <polyline points="8,17 14,12 20,7 26,5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
  <!-- Dot at tip -->
  <circle cx="26" cy="5" r="2" fill="white"/>
</svg>
